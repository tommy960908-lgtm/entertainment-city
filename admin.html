<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XM娛樂城｜後台管理</title>
<style>
:root{--gold:#e2b94f;--line:#392c18;--panel:#100f0c;--muted:#918a7e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#f3f0e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
button,input{font:inherit}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#241704,#050505 45%)}
.login-card{width:min(420px,100%);padding:24px;background:#0e0d0b;border:1px solid var(--line);border-radius:18px}
.brand{font-size:28px;font-weight:1000;color:var(--gold)}.brand small{display:block;font-size:10px;letter-spacing:3px;color:#ddd}
.field{margin:15px 0}.field label{display:block;font-size:13px;color:#bbb2a2;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #413521;border-radius:10px;background:#080808;color:white}
.primary,.ghost,.danger,.ok{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:10px 13px;font-weight:850;text-decoration:none;cursor:pointer;pointer-events:auto!important;position:relative;z-index:2}
.primary{border:0;background:linear-gradient(#f0d071,#c99a2d);color:#171008}.ghost{border:1px solid #594421;background:#0b0a08;color:#e2c069}.danger{border:1px solid #703737;background:#180c0c;color:#e89898}.ok{border:1px solid #356041;background:#0d1710;color:#8bdc9e}
.direct{width:100%;margin-top:4px}
#admin-panel{display:none}
body.xm-admin-authenticated #admin-panel{display:block}
body.xm-admin-authenticated .login{display:none!important}
body.xm-admin-authenticated{overflow:auto!important;height:auto!important}
.top{position:sticky;top:0;z-index:20;background:#070706f3;border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:auto;height:64px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{color:var(--gold);font-size:19px;font-weight:1000}.top-actions{display:flex;gap:7px}
.wrap{max-width:1180px;margin:auto;padding:17px 14px 36px}
.status{margin-bottom:12px;padding:9px 11px;border:1px solid #293723;border-radius:9px;color:#91d79b;background:#0b130d;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat,.panel{background:linear-gradient(#11100d,#090806);border:1px solid #302617;border-radius:14px}.stat{padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;margin-top:4px;color:#efca67;font-size:23px}
.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab{white-space:nowrap;border:1px solid #47371e;background:#0c0b09;color:#aaa;border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{color:#efca67;background:#36260d}
.panel{padding:14px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:18px}
.table-wrap{overflow:auto;border:1px solid #251f16;border-radius:10px}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #211b14;font-size:13px}th{color:#d9b95d;background:#0b0a08}.money{color:#ecc966;font-weight:850}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:6px 8px;font-size:12px}.empty{text-align:center;color:#756e64;padding:28px}
.modal{position:fixed;inset:0;z-index:100;background:#000b;display:grid;place-items:center;padding:18px}.modal-card{width:min(460px,100%);padding:17px;background:#11100d;border:1px solid #49381e;border-radius:15px}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.x{border:0;background:none;color:#aaa;font-size:25px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

/* 新交易通知 */
.xm-request-notice{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.78);
}
.xm-request-notice.show{display:flex}
.xm-request-notice-card{
  width:min(100%,420px);
  background:linear-gradient(180deg,#16130d,#090909);
  border:1px solid #826128;
  border-radius:18px;
  padding:20px;
  box-shadow:0 24px 80px rgba(0,0,0,.7);
}
.xm-request-notice-title{
  color:#f2cc68;
  font-size:21px;
  font-weight:950;
  margin-bottom:16px;
}
.xm-request-info{
  border:1px solid #342a1c;
  background:#080808;
  border-radius:12px;
  padding:13px;
  line-height:1.9;
  margin-bottom:15px;
}
.xm-request-info b{color:#f0c969}
.xm-request-notice-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}


#xmRequestNotice button,
.xm-approve-btn,
.xm-reject-btn{
  pointer-events:auto!important;
  touch-action:manipulation!important;
  -webkit-tap-highlight-color:transparent!important;
  position:relative!important;
  z-index:100001!important;
}

</style>
</head>
<body>

<section class="login">
  <form id="xmAdminLoginForm" class="login-card" autocomplete="off">
    <div class="brand">XM娛樂城<small>ADMIN CONSOLE</small></div>
    <h2 style="margin-top:25px">管理員登入</h2>

    <div class="field">
      <label>管理員帳號</label>
      <input id="xmAdminUser" type="text" autocomplete="off" placeholder="請輸入管理員帳號">
    </div>

    <div class="field">
      <label>密碼</label>
      <input id="xmAdminPass" type="password" autocomplete="new-password" placeholder="請輸入密碼">
    </div>

    <div id="xmAdminLoginError" style="min-height:20px;color:#e89898;font-size:13px;margin-bottom:8px"></div>

    <button class="primary direct" type="submit">登入後台</button>
  </form>
</section>

<section id="admin-panel">
  <header class="top">
    <div class="topin">
      <div class="title">XM娛樂城｜後台管理</div>
      <div class="top-actions">
        <button type="button" class="ghost" data-action="refresh">重新整理</button><button type="button" class="danger" id="xmAdminPersistentLogout">登出</button>
        <button class="danger" type="button" id="xmAdminLogoutBtn">登出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="jsStatus" class="status">後台程式載入中…</div>

    <div class="stats">
      <div class="stat"><small>玩家帳號</small><strong id="statUsers">0</strong></div>
      <div class="stat"><small>玩家總餘額</small><strong id="statBalance">0.00</strong></div>
      <div class="stat"><small>待處理交易</small><strong id="statPending">0</strong></div>
      <div class="stat"><small>可領返水</small><strong id="statRebate">0.00</strong></div>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="players">玩家管理</button>
      <button type="button" class="tab" data-tab="transactions">交易管理</button>
      <button type="button" class="tab" data-tab="rebates">返水管理</button>
    </div>

    <section id="playersView" class="panel">
      <div class="panel-head"><h2>玩家管理</h2><button type="button" class="ghost" data-action="create-user">新增玩家</button></div>
      <div class="table-wrap"><table><thead><tr><th>帳號</th><th>餘額</th><th>返水</th><th>流水</th><th>帳號管理</th></tr></thead><tbody id="playersBody"></tbody></table></div>
    </section>

    <section id="transactionsView" class="panel hidden">
      <div class="panel-head"><h2>交易管理</h2></div>
      <div class="table-wrap"><table><thead><tr><th>玩家</th><th>類型</th><th>金額</th><th>狀態</th><th>時間</th><th>操作</th></tr></thead><tbody id="txBody"></tbody></table></div>
    </section>

    <section id="rebatesView" class="panel hidden">
      <div class="panel-head"><h2>返水管理</h2></div>
      <div class="table-wrap"><table><thead><tr><th>玩家</th><th>餘額</th><th>可領返水</th><th>發放時間</th><th>操作</th></tr></thead><tbody id="rebateBody"></tbody></table></div>
    </section>
  </main>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle"></h3><button type="button" class="x" data-action="close-modal">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var byId=function(id){return document.getElementById(id)};
function getUsers(){try{return JSON.parse(localStorage.getItem("xm_demo_users")||"{}")}catch(e){return {}}}
function saveUsers(v){localStorage.setItem("xm_demo_users",JSON.stringify(v))}
function readJson(k,f){try{var raw=localStorage.getItem(k);if(!raw)return f;var v=JSON.parse(raw);return v==null?f:v}catch(e){return f}}
function money(v){return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function dateText(ts){if(!ts)return "-";return new Date(Number(ts)).toLocaleString("zh-TW",{hour12:false})}
function currentKey(u){return "xm_tx_current_v2_"+u}
function historyKey(u){return "xm_tx_history_v2_"+u}
function rebateKey(u){return "xm_rebate_balance_"+u}
function rebateTimeKey(u){return "xm_rebate_issued_at_"+u}
function turnoverKey(u){return "xm_rebate_turnover_"+u}
function clearLocks(){["xm_active_transaction_until","xm_transaction_lock_until","xm_payment_wait_deadline_v2","xm_payment_wait_deadline","xm_active_transaction_type","xm_transaction_type"].forEach(function(k){localStorage.removeItem(k)})}
function allTx(){
  var out=[],us=getUsers();
  Object.keys(us).forEach(function(u){
    var c=readJson(currentKey(u),null);
    if(c)out.push(Object.assign({user:u,current:true},c));
    readJson(historyKey(u),[]).forEach(function(x){out.push(Object.assign({user:u,current:false},x))});
  });
  return out.sort(function(a,b){return Number(b.createdAt||b.finishedAt||0)-Number(a.createdAt||a.finishedAt||0)});
}
function openModal(title,html){byId("modalTitle").textContent=title;byId("modalBody").innerHTML=html;byId("modal").classList.remove("hidden")}
function closeModal(){byId("modal").classList.add("hidden")}
function render(){
  var us=getUsers(),names=Object.keys(us),total=0,reb=0;
  names.forEach(function(u){total+=Number(us[u].balance||0);reb+=Number(localStorage.getItem(rebateKey(u))||0)});
  byId("statUsers").textContent=names.length;
  byId("statBalance").textContent=money(total);
  var tx=allTx();
  byId("statPending").textContent=tx.filter(function(x){return x.current&&x.status==="pending"}).length;
  byId("statRebate").textContent=money(reb);

  byId("playersBody").innerHTML=names.length?names.map(function(u){
    return '<tr><td><b>'+esc(u)+'</b></td><td class="money">'+money(us[u].balance)+'</td><td>'+money(localStorage.getItem(rebateKey(u))||0)+'</td><td>'+money(localStorage.getItem(turnoverKey(u))||0)+'</td><td><div class="actions">'
    +''
    +'<button type="button" class="ghost mini" data-action="password" data-user="'+encodeURIComponent(u)+'">改密碼</button>'
    +'<button type="button" class="danger mini" data-action="unlock" data-user="'+encodeURIComponent(u)+'">解除交易</button>'
    +'</div></td></tr>';
  }).join(""):'<tr><td colspan="5" class="empty">沒有玩家帳號</td></tr>';

  byId("txBody").innerHTML=tx.length?tx.map(function(x){
    return '<tr><td>'+esc(x.user)+'</td><td>'+(x.type==="withdraw"?"提款":"存款")+'</td><td class="money">'+money(x.amount)+'</td><td>'+esc(x.status||"pending")+'</td><td>'+dateText(x.createdAt)+'</td><td>'
    +(x.current?'<div class="actions"><button type="button" class="ok mini" data-action="tx-success" data-user="'+encodeURIComponent(x.user)+'">完成</button><button type="button" class="danger mini" data-action="tx-failed" data-user="'+encodeURIComponent(x.user)+'">失敗</button></div>':'—')+'</td></tr>';
  }).join(""):'<tr><td colspan="6" class="empty">沒有交易紀錄</td></tr>';

  byId("rebateBody").innerHTML=names.length?names.map(function(u){
    return '<tr><td>'+esc(u)+'</td><td class="money">'+money(us[u].balance)+'</td><td>'+money(localStorage.getItem(rebateKey(u))||0)+'</td><td>'+dateText(localStorage.getItem(rebateTimeKey(u)))+'</td><td><button type="button" class="ghost mini" data-action="rebate" data-user="'+encodeURIComponent(u)+'">發放返水</button></td></tr>';
  }).join(""):'<tr><td colspan="5" class="empty">沒有玩家帳號</td></tr>';
}
function finishTx(u,status){
  var c=readJson(currentKey(u),null);if(!c)return;
  c.status=status;c.finishedAt=Date.now();
  var h=readJson(historyKey(u),[]);h.unshift(c);
  localStorage.setItem(historyKey(u),JSON.stringify(h));
  localStorage.removeItem(currentKey(u));clearLocks();render();
}
function showTab(name,btn){
  ["players","transactions","rebates"].forEach(function(v){byId(v+"View").classList.toggle("hidden",v!==name)});
  Array.from(document.querySelectorAll(".tab")).forEach(function(x){x.classList.remove("active")});
  if(btn)btn.classList.add("active");
}

document.addEventListener("click",function(e){
  var tab=e.target.closest("[data-tab]");
  if(tab){showTab(tab.getAttribute("data-tab"),tab);return}

  var b=e.target.closest("[data-action]");
  if(!b)return;
  var action=b.getAttribute("data-action");
  var u=decodeURIComponent(b.getAttribute("data-user")||"");

  if(action==="refresh"){render();return}
  if(action==="close-modal"){closeModal();return}
  if(action==="create-user"){
    openModal("新增玩家",'<div class="field"><label>帳號</label><input id="mUser"></div><div class="field"><label>密碼</label><input id="mPass"></div><div class="field"><label>初始餘額</label><input id="mAmount" type="number" value="0"></div><button type="button" class="primary" data-action="create-user-save">建立帳號</button>');return
  }
  if(action==="create-user-save"){
    var un=(byId("mUser").value||"").trim(),pw=byId("mPass").value||"",bal=Math.max(0,Number(byId("mAmount").value)||0),us=getUsers();
    if(!un||!pw||us[un])return;
    us[un]={password:pw,balance:bal};saveUsers(us);closeModal();render();return
  }
  if(action==="password"){
    openModal("改密碼｜"+u,'<div class="field"><label>新密碼</label><input id="mPass"></div><button type="button" class="primary" data-action="password-save" data-user="'+encodeURIComponent(u)+'">確認</button>');return
  }
  if(action==="password-save"){
    var np=byId("mPass").value||"",us3=getUsers();if(!np||!us3[u])return;
    us3[u].password=np;saveUsers(us3);closeModal();render();return
  }
  if(action==="unlock"){localStorage.removeItem(currentKey(u));clearLocks();render();return}
  if(action==="tx-success"){finishTx(u,"success");return}
  if(action==="tx-failed"){finishTx(u,"failed");return}
  if(action==="rebate"){
    openModal("發放返水｜"+u,'<div class="field"><label>返水金額</label><input id="mAmount" type="number" min="0"></div><button type="button" class="primary" data-action="rebate-save" data-user="'+encodeURIComponent(u)+'">確認發放</button>');return
  }
  if(action==="rebate-save"){
    var amt=Math.max(0,Number(byId("mAmount").value)||0);
    localStorage.setItem(rebateKey(u),String(amt));
    if(amt>0)localStorage.setItem(rebateTimeKey(u),String(Date.now()));else localStorage.removeItem(rebateTimeKey(u));
    closeModal();render();return
  }
});

byId("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});
byId("jsStatus").textContent="後台程式：已載入，可操作";



render();
})();
</script>


<script id="xm-admin-approval-bridge">
(function(){
"use strict";

var shownPendingIds={};
var activeNoticeId="";

function byId(id){return document.getElementById(id)}
function getUsers(){try{return JSON.parse(localStorage.getItem("xm_demo_users")||"{}")}catch(e){return {}}}
function saveUsers(v){localStorage.setItem("xm_demo_users",JSON.stringify(v))}
function getRequests(){try{var a=JSON.parse(localStorage.getItem("xm_admin_requests_v1")||"[]");return Array.isArray(a)?a:[]}catch(e){return []}}
function saveRequests(a){localStorage.setItem("xm_admin_requests_v1",JSON.stringify(a))}
function readJson(k,f){try{var v=JSON.parse(localStorage.getItem(k)||"");return v==null?f:v}catch(e){return f}}
function money(v){return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateText(ts){if(!ts)return "-";return new Date(Number(ts)).toLocaleString("zh-TW",{hour12:false})}
function historyKey(u){return "xm_tx_history_v2_"+u}
function currentKey(u){return "xm_tx_current_v2_"+u}
function rebateKey(u){return "xm_rebate_balance_"+u}
function rebateTimeKey(u){return "xm_rebate_issued_at_"+u}

function clearLocks(){
  ["xm_active_transaction_until","xm_transaction_lock_until","xm_payment_wait_deadline_v2","xm_payment_wait_deadline","xm_active_transaction_type","xm_transaction_type"].forEach(function(k){
    localStorage.removeItem(k);
  });
}

function pendingRequests(){
  return getRequests()
    .filter(function(r){return r && r.status==="pending"})
    .sort(function(a,b){return Number(a.createdAt||0)-Number(b.createdAt||0)});
}

function renderRequests(){
  var body=byId("txBody");
  var reqs=getRequests().sort(function(x,y){return Number(y.createdAt||0)-Number(x.createdAt||0)});

  if(body){
    body.innerHTML=reqs.length?reqs.map(function(r){
      var pending=r.status==="pending";
      var label=r.type==="withdraw"?"提款":"存款";

      return '<tr>'+
        '<td><b>'+String(r.user||"")+'</b></td>'+
        '<td>'+label+'</td>'+
        '<td class="money">'+money(r.amount)+'</td>'+
        '<td>'+(pending
          ?'<span class="badge red">待審核</span>'
          :(r.status==="success"
            ?'<span class="badge green">交易成功</span>'
            :'<span class="badge red">交易失敗</span>'))+
        '</td>'+
        '<td>'+dateText(r.createdAt)+'</td>'+
        '<td>'+(pending
          ?'<div class="row-actions">'+
             '<button class="ok mini xm-approve-btn" type="button" data-id="'+r.id+'" onclick="xmApproveRequestById(this.getAttribute('data-id'))">接受</button>'+
             '<button class="danger mini xm-reject-btn" type="button" data-id="'+r.id+'" onclick="xmRejectRequestById(this.getAttribute('data-id'))">拒絕</button>'+
           '</div>'
          :'—')+
        '</td>'+
      '</tr>';
    }).join("")
    :'<tr><td colspan="6" class="empty">目前沒有交易申請</td></tr>';
  }

  /* 待處理交易完全以 request queue 為唯一來源，避免 1 / 0 閃爍 */
  var stat=byId("statPending");
  if(stat) stat.textContent=pendingRequests().length;
}

function showNextNotice(){
  if(activeNoticeId) return;

  var pending=pendingRequests();
  var next=pending.find(function(r){return !shownPendingIds[r.id]});
  if(!next) return;

  activeNoticeId=next.id;
  shownPendingIds[next.id]=true;

  var typeText=next.type==="withdraw"?"提款":"存款";
  var info=byId("xmRequestNoticeInfo");
  if(info){
    info.innerHTML=
      '玩家 ID：<b>'+String(next.user||"")+'</b><br>'+
      '申請類型：<b>'+typeText+'</b><br>'+
      '申請金額：<b>'+money(next.amount)+'</b>';
  }

  var modal=byId("xmRequestNotice");
  if(modal) modal.classList.add("show");
}

function hideNotice(){
  var modal=byId("xmRequestNotice");
  if(modal) modal.classList.remove("show");
  activeNoticeId="";
  setTimeout(showNextNotice,120);
}

function completeRequest(id,accept){
  var reqs=getRequests();
  var idx=reqs.findIndex(function(r){return r.id===id});
  if(idx<0)return;

  var r=reqs[idx];
  if(r.status!=="pending"){
    hideNotice();
    return;
  }

  var us=getUsers();
  if(!us[r.user]){
    alert("找不到玩家帳號："+r.user);
    hideNotice();
    return;
  }

  var amount=Math.max(0,Number(r.amount)||0);
  var applied=0;

  if(accept){
    if(r.type==="deposit"){
      us[r.user].balance=Number(us[r.user].balance||0)+amount;
      applied=amount;
    }else{
      var bal=Number(us[r.user].balance||0);
      if(amount>bal){
        alert("玩家目前餘額不足，無法接受這筆提款");
        return;
      }
      us[r.user].balance=bal-amount;
      applied=amount;
    }

    saveUsers(us);
    r.status="success";
  }else{
    r.status="failed";
    applied=0;
  }

  r.finishedAt=Date.now();
  r.appliedAmount=applied;

  var hist=readJson(historyKey(r.user),[]);
  hist.unshift({
    id:r.id,
    type:r.type,
    amount:r.amount,
    appliedAmount:applied,
    createdAt:r.createdAt,
    finishedAt:r.finishedAt,
    status:r.status
  });

  localStorage.setItem(historyKey(r.user),JSON.stringify(hist));
  localStorage.removeItem(currentKey(r.user));
  clearLocks();

  reqs[idx]=r;
  saveRequests(reqs);

  renderRequests();
  hideNotice();

  if(typeof window.xmAdminRender==="function"){

<script id="xm-admin-login-gate">
(function(){
  "use strict";

  /*
    GitHub Pages 是純前端頁面，所以這是介面層登入保護。
    管理員帳號：admin
    密碼：xmadmin123
    不在畫面顯示，也不預先填入。
  */
  var ADMIN_USER = "admin";
  var ADMIN_PASS = "xmadmin123";
  var SESSION_KEY = "xm_admin_authenticated_v1";

  function showAdmin(){
    document.body.classList.add("xm-admin-authenticated");
    var panel=document.getElementById("admin-panel");
    if(panel) panel.scrollTop=0;
    try{ localStorage.setItem(SESSION_KEY,"1"); }catch(e){}
    if(typeof window.xmAdminRender==="function"){
      try{ window.xmAdminRender(); }catch(e){}
    }
  }

  function showLogin(){
    document.body.classList.remove("xm-admin-authenticated");
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    history.replaceState(null,"",location.pathname + location.search);
    var u=document.getElementById("xmAdminUser");
    var p=document.getElementById("xmAdminPass");
    var err=document.getElementById("xmAdminLoginError");
    if(u) u.value="";
    if(p) p.value="";
    if(err) err.textContent="";
  }

  function init(){
    var form=document.getElementById("xmAdminLoginForm");
    var logout=document.getElementById("xmAdminLogoutBtn");

    if(form){
      form.addEventListener("submit",function(e){
        e.preventDefault();

        var u=(document.getElementById("xmAdminUser").value||"").trim();
        var p=document.getElementById("xmAdminPass").value||"";
        var err=document.getElementById("xmAdminLoginError");

        if(u===ADMIN_USER && p===ADMIN_PASS){
          if(err) err.textContent="";
          showAdmin();
        }else{
          if(err) err.textContent="帳號或密碼錯誤";
        }
      });
    }

    if(logout){
      logout.addEventListener("click",function(){
        showLogin();
      });
    }

    var authenticated=false;
    try{
      authenticated=localStorage.getItem(SESSION_KEY)==="1";
    }catch(e){}

    if(authenticated){
      showAdmin();
    }else{
      showLogin();
    }
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init);
  }else{
    init();
  }
})();
</script>


<script id="xm-firebase-cross-device-admin">
(function(){
"use strict";
const DB="https://xm-casino-default-rtdb.asia-southeast1.firebasedatabase.app";
let lastPending=new Set(), noticeId="";

function safeKey(s){return encodeURIComponent(String(s)).replace(/\./g,"%2E")}
async function get(path){const r=await fetch(DB+path+".json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("GET "+r.status);return await r.json()}
async function put(path,v){const r=await fetch(DB+path+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw new Error("PUT "+r.status);return await r.json()}
async function patch(path,v){const r=await fetch(DB+path+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw new Error("PATCH "+r.status);return await r.json()}
function money(v){return Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dt(v){return v?new Date(Number(v)).toLocaleString("zh-TW",{hour12:false}):"-"}

async function requests(){
  const o=await get("/requests");
  return o?Object.values(o).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)):[];
}
function showNotice(r){
  if(!r||noticeId)return;
  noticeId=r.id;
  const info=document.getElementById("xmRequestNoticeInfo");
  if(info) info.innerHTML='玩家 ID：<b>'+r.user+'</b><br>申請類型：<b>'+(r.type==="withdraw"?"提款":"存款")+'</b><br>申請金額：<b>'+money(r.amount)+'</b>';
  document.getElementById("xmRequestNotice")?.classList.add("show");
}
function hideNotice(){
  document.getElementById("xmRequestNotice")?.classList.remove("show");
  noticeId="";
}
async function renderRemote(){
  const rs=await requests();
  const pending=rs.filter(r=>r.status==="pending");
  const body=document.getElementById("txBody");
  if(body){
    body.innerHTML=rs.length?rs.map(r=>'<tr><td><b>'+r.user+'</b></td><td>'+(r.type==="withdraw"?"提款":"存款")+'</td><td class="money">'+money(r.amount)+'</td><td>'+(r.status==="pending"?'<span class="badge red">待審核</span>':r.status==="success"?'<span class="badge green">交易成功</span>':'<span class="badge red">交易失敗</span>')+'</td><td>'+dt(r.createdAt)+'</td><td>'+(r.status==="pending"?'<div class="row-actions"><button class="ok mini" type="button" onclick="xmFirebaseApprove(\''+r.id+'\')">接受</button><button class="danger mini" type="button" onclick="xmFirebaseReject(\''+r.id+'\')">拒絕</button></div>':'—')+'</td></tr>').join(""):'<tr><td colspan="6" class="empty">目前沒有交易申請</td></tr>';
  }
  const stat=document.getElementById("statPending"); if(stat)stat.textContent=pending.length;
  const current=new Set(pending.map(r=>r.id));
  const fresh=pending.find(r=>!lastPending.has(r.id));
  if(fresh) showNotice(fresh);
  lastPending=current;
}

async function finish(id,accept){
  const r=await get("/requests/"+id);
  if(!r||r.status!=="pending"){hideNotice();return}
  const pk=safeKey(r.user);
  let player=await get("/players/"+pk);
  if(!player) player={id:r.user,balance:0,createdAt:Date.now()};
  const amount=Math.max(0,Number(r.amount||0));
  let applied=0;
  if(accept){
    if(r.type==="deposit"){player.balance=Number(player.balance||0)+amount;applied=amount}
    else {
      const bal=Number(player.balance||0);
      if(amount>bal){alert("玩家目前餘額不足，無法接受這筆提款");return}
      player.balance=bal-amount;applied=amount;
    }
    await put("/players/"+pk,player);
    r.status="success";
  } else {
    r.status="failed";
  }
  r.finishedAt=Date.now(); r.appliedAmount=applied;
  await put("/requests/"+id,r);
  await put("/history/"+pk+"/"+id,r);
  hideNotice();
  await renderRemote();
}

window.xmFirebaseApprove=id=>finish(id,true).catch(e=>{console.error(e);alert("接受失敗，請重新再試")});
window.xmFirebaseReject=id=>finish(id,false).catch(e=>{console.error(e);alert("拒絕失敗，請重新再試")});
window.xmApproveCurrentRequest=function(){if(noticeId)window.xmFirebaseApprove(noticeId);return false};
window.xmRejectCurrentRequest=function(){if(noticeId)window.xmFirebaseReject(noticeId);return false};
window.xmApproveRequestById=function(id){window.xmFirebaseApprove(id);return false};
window.xmRejectRequestById=function(id){window.xmFirebaseReject(id);return false};

setInterval(()=>renderRemote().catch(()=>{}),900);
setTimeout(()=>renderRemote().catch(console.error),300);
})();
</script>


<script id="xm-admin-persistent-login">
(function(){
"use strict";

var SESSION_KEYS = [
  "xm_admin_session",
  "xm_admin_authenticated_v1"
];

function clearAdminLogin(){
  SESSION_KEYS.forEach(function(k){
    try{ localStorage.removeItem(k); }catch(e){}
    try{ sessionStorage.removeItem(k); }catch(e){}
  });

  document.body.classList.remove("xm-admin-authenticated");

  var panel=document.getElementById("admin-panel");
  if(panel) panel.style.display="none";

  var app=document.getElementById("appView");
  if(app) app.classList.add("hidden");

  var login=document.getElementById("loginView") || document.querySelector(".login");
  if(login){
    login.style.display="";
    login.classList.remove("hidden");
  }

  try{
    history.replaceState(null,"",location.pathname+location.search);
  }catch(e){}

  location.reload();
}

function bindLogout(){
  var btn=document.getElementById("xmAdminPersistentLogout");
  if(btn){
    btn.onclick=function(e){
      if(e){
        e.preventDefault();
        e.stopPropagation();
      }
      clearAdminLogin();
      return false;
    };
  }
}

function persistExistingLogin(){
  /*
    If an older version authenticated this tab via sessionStorage,
    promote it to localStorage once so upgrades don't log the admin out.
  */
  try{
    if(sessionStorage.getItem("xm_admin_session")==="1"){
      localStorage.setItem("xm_admin_session","1");
    }
    if(sessionStorage.getItem("xm_admin_authenticated_v1")==="1"){
      localStorage.setItem("xm_admin_authenticated_v1","1");
    }
  }catch(e){}
}

persistExistingLogin();

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",bindLogout);
}else{
  bindLogout();
}

window.xmAdminPersistentLogout=clearAdminLogin;
})();
</script>
