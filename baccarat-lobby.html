.room-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.room-card{padding:0;border:1px solid #6d542a;border-radius:13px;background:#0b0a08;color:#fff;overflow:hidden;text-align:left;box-shadow:0 5px 18px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent}

.room-top{height:35px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#1c170f,#0e0c08);color:#e3c274;font-size:12px;border-bottom:1px solid #4d3c20}
.room-round{color:#9c917f}
.room-main{height:130px;display:grid;grid-template-columns:34% 66%;background:#f7f7f2}
.dealer{position:relative;background:linear-gradient(180deg,#2d1f16,#111);display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #aa9b82}
.dealer-head{width:55px;height:55px;border-radius:50%;background:linear-gradient(#f2d37a,#9a6d1f);color:#22180c;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 12px rgba(0,0,0,.4)}
.dealer-name{margin-top:8px;background:#d4b66d;color:#251a0b;padding:3px 7px;font-size:11px}
.mini-road{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);background:white}
.mini-cell{border-right:1px solid #dedede;border-bottom:1px solid #dedede;display:flex;align-items:center;justify-content:center}
.dot{width:72%;aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:8px;font-weight:900}
.dot.banker{background:#d92930} .dot.player{background:#2870c8} .dot.tie{background:#2d9a48}
.room-bottom{min-height:34px;padding:0 9px;display:flex;align-items:center;gap:6px;color:#8bc88c;font-size:11px}
.room-bottom b{margin-left:auto;color:#e8c66c;font-size:11px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#47b852;box-shadow:0 0 7px #47b852}
.notice{margin-top:14px;padding:13px;border:1px solid #392d1b;border-radius:12px;background:#090806;color:#9c8d76;font-size:12px;line-height:1.6}
@media(max-width:520px){

<script>
(function(){
"use strict";
var DB="https://xm-casino-default-rtdb.asia-southeast1.firebasedatabase.app";
var BET_MS=10000,CARD_MS=1500,MAX_CARDS=6,RESULT_MS=4000;
var ROUND_MS=BET_MS+CARD_MS*MAX_CARDS+RESULT_MS;
var ROOM_IDS=[&#x27;RB01&#x27;, &#x27;RB02&#x27;, &#x27;RB03&#x27;, &#x27;RB04&#x27;, &#x27;RB05&#x27;, &#x27;RB06&#x27;, &#x27;RB07&#x27;];

function safeKey(s){return encodeURIComponent(String(s)).replace(/\./g,"%2E")}
async function get(path){
  var r=await fetch(DB+path+".json?ts="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(r.status);
  return await r.json();
}

function drawRoad(el,room){
  el.innerHTML="";
  for(var i=0;i<48;i++){
    var c=document.createElement("div");c.className="mini-cell";el.appendChild(c);
  }
  var seed=room.split("").reduce(function(a,c){return a+c.charCodeAt(0)},0);
  for(var j=0;j<Math.min(16,(seed%13)+4);j++){
    var cell=el.children[j];
    var d=document.createElement("div");
    var n=(seed+j*7)%10;
    var type=n<5?"banker":(n<9?"player":"tie");
    d.className="dot "+type;
    d.textContent=type==="banker"?"莊":type==="player"?"閒":"和";
    cell.appendChild(d);
  }
}

async function refreshRoom(room){
  var info=null;
  try{info=await get("/baccarat/rooms/"+room)}catch(e){}
  var now=Date.now();
  var epoch=info&&info.epoch?Number(info.epoch):Date.parse("2026-08-11T00:00:00+08:00");
  var elapsed=Math.max(0,now-epoch);
  var round=Math.floor(elapsed/ROUND_MS)%108+1;
  var rem=BET_MS-(elapsed%ROUND_MS);
  document.getElementById("round-"+room).textContent="第 "+round+" 局";
  document.getElementById("state-"+room).textContent=rem>0&&rem<=BET_MS?"下注中":"進行中";
  drawRoad(document.getElementById("road-"+room),room);
}

async function refreshWallet(){
  var u=localStorage.getItem("xm_demo_session")||"";
  if(!u)return;
  try{
    var v=await get("/wallets/"+safeKey(u)+"/baccarat");
    document.getElementById("walletBalance").textContent=Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  }catch(e){}
}

document.addEventListener("click",function(e){
  var card=e.target.closest&&e.target.closest(".room-card");
  if(!card)return;
  var room=card.getAttribute("data-room");
  location.href="baccarat-room.html?room="+encodeURIComponent(room);
});

ROOM_IDS.forEach(refreshRoom);
refreshWallet();
setInterval(function(){ROOM_IDS.forEach(refreshRoom);refreshWallet()},3000);
})();
</script>
